# niri's own portal preferences (/usr/share/xdg-desktop-portal/niri-portals.conf),
# except for the file chooser: xdg-desktop-portal-gnome uses Nautilus for it,
# which this image doesn't ship, so use the GTK one instead.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=oo7-portal;gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
